name: release

# Runs the CI suite, then builds the production image and pushes it to GHCR.
# .docker/compose.prod.yaml pulls what this publishes, so a deploy is a
# `docker compose pull && up -d` against the tag this workflow moved.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

# One release at a time per ref. Not cancel-in-progress: a half-pushed image is
# worse than a queued build.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # Reuses .github/workflows/tests.yml verbatim; the image job only starts if
  # lint, static analysis and the test suite all pass.
  tests:
    uses: ./.github/workflows/tests.yml

  image:
    needs: tests
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required to push to GHCR with the job's own GITHUB_TOKEN.
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercases the repository name for us — GHCR rejects the uppercase in
      # `Nothehi/Barkeep`.
      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          # The Dockerfile expects the repository root, and reads its excludes
          # from .docker/Dockerfile.dockerignore.
          context: .
          file: .docker/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Compiling swoole from source dominates the build, so the layer
          # cache is what keeps this workflow to a few minutes.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise the published image
        run: |
          {
            echo '### Published'
            echo
            echo '```'
            echo '${{ steps.meta.outputs.tags }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
