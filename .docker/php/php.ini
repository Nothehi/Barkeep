; Production PHP settings for the Octane worker. Loaded last, so these override
; the base image.

expose_php = Off
memory_limit = 512M

; Octane enforces its own per-request limit via octane.max_execution_time; the
; CLI SAPI's own limit must stay off or long requests kill the whole worker.
max_execution_time = 0

upload_max_filesize = 32M
post_max_size = 32M

display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

date.timezone = UTC

; Swoole does not populate the superglobals the CLI SAPI normally skips, and
; Octane's Sail configuration sets the same value.
variables_order = EGPCS

realpath_cache_size = 4096K
realpath_cache_ttl = 600

opcache.enable = 1
; Octane runs under the CLI SAPI, so without this opcache does nothing at all.
opcache.enable_cli = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
; The code in the image never changes, so skip the mtime checks entirely.
opcache.validate_timestamps = 0
opcache.save_comments = 1
