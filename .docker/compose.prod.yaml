# Production-shaped stack, for verifying the release image locally or as a
# starting point for a single-host deployment.
#
#   cp .docker/.env.docker.example .docker/.env.docker   # then set APP_KEY
#   docker compose -f .docker/compose.prod.yaml up --build
#
# App: http://localhost:8080

name: barkeep-prod

x-image: &image
  build:
    # Paths here resolve against this file's directory, so the context is the
    # repository root one level up.
    context: ..
    dockerfile: .docker/Dockerfile
    target: runtime
  image: barkeep:latest
  env_file:
    - .env.docker
  volumes:
    - storage:/var/www/html/storage
  restart: unless-stopped

services:
  web:
    <<: *image
    ports:
      - "${WEB_PORT:-8080}:8000"
    environment:
      RUN_MIGRATIONS: "true"

  queue:
    <<: *image
    command: php artisan queue:work --tries=3 --timeout=90 --sleep=1
    environment:
      # The web container owns migrations; this one just waits for the schema.
      RUN_MIGRATIONS: "false"
    depends_on:
      web:
        condition: service_healthy

volumes:
  storage:
