# Production-shaped stack, for verifying the release image locally or as a
# starting point for a single-host deployment.
#
# Locally:
#   cp .docker/.env.docker.example .docker/.env.docker   # then set APP_KEY
#   docker compose --env-file .docker/.env.docker \
#     -f .docker/compose.prod.yaml up --build
#
# On a managed host (Dockhand, Portainer, plain `docker compose`) there is no
# .env.docker on disk — Dockhand keeps stack env in its own database and never
# writes a file to the host — so nothing here reads one. Every value is an
# interpolated ${VAR} with a production default baked in; set overrides, and
# APP_KEY, in the stack's own environment. The entrypoint refuses to boot
# without APP_KEY, so a misconfigured deploy fails loudly rather than silently.
#
# App: http://localhost:8080

name: barkeep-prod

# Merged into each service's own environment map. This must be a separate
# anchor from x-image: YAML merge keys replace whole mappings rather than
# deep-merging, so an `environment:` inside x-image would be silently
# discarded by the per-service `environment:` blocks further down.
x-env: &env
  APP_NAME: "${APP_NAME:-Barkeep}"
  APP_ENV: "${APP_ENV:-production}"
  # No default: entrypoint.sh exits if this is empty, which is the intended
  # behaviour for a stack deployed without its key.
  APP_KEY: "${APP_KEY:?APP_KEY must be set in the stack environment}"
  APP_DEBUG: "${APP_DEBUG:-false}"
  APP_URL: "${APP_URL:-https://barkeep.ir}"

  APP_LOCALE: "${APP_LOCALE:-en}"
  APP_FALLBACK_LOCALE: "${APP_FALLBACK_LOCALE:-en}"
  APP_FAKER_LOCALE: "${APP_FAKER_LOCALE:-en_US}"

  LOG_CHANNEL: "${LOG_CHANNEL:-stderr}"
  LOG_LEVEL: "${LOG_LEVEL:-warning}"

  # SQLite lives inside the `storage` volume so it survives image rebuilds.
  DB_CONNECTION: "${DB_CONNECTION:-sqlite}"
  DB_DATABASE: "${DB_DATABASE:-/var/www/html/storage/database/database.sqlite}"

  OCTANE_SERVER: "${OCTANE_SERVER:-swoole}"
  # Traefik terminates TLS and forwards plain HTTP, so Octane has to be told
  # the request was secure or every generated URL comes out as http://.
  OCTANE_HTTPS: "${OCTANE_HTTPS:-true}"

  SESSION_DRIVER: "${SESSION_DRIVER:-database}"
  SESSION_LIFETIME: "${SESSION_LIFETIME:-120}"
  SESSION_ENCRYPT: "${SESSION_ENCRYPT:-false}"
  SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-true}"

  CACHE_STORE: "${CACHE_STORE:-database}"
  QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"
  BROADCAST_CONNECTION: "${BROADCAST_CONNECTION:-log}"
  FILESYSTEM_DISK: "${FILESYSTEM_DISK:-local}"

  MAIL_MAILER: "${MAIL_MAILER:-log}"
  MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-hello@example.com}"
  MAIL_FROM_NAME: "${MAIL_FROM_NAME:-Barkeep}"

x-image: &image
  build:
    # Paths here resolve against this file's directory, so the context is the
    # repository root one level up.
    context: ..
    dockerfile: .docker/Dockerfile
    target: runtime
  image: barkeep:latest
  # Deliberately no `env_file:` here. A service-level env_file always loses to
  # `environment:`, so with x-env covering every variable it would be silently
  # ignored. Local overrides go through compose's --env-file instead (see the
  # header), which feeds the same ${...} interpolation the stack env uses.
  volumes:
    - storage:/var/www/html/storage
  restart: unless-stopped

services:
  web:
    <<: *image
    ports:
      - "${WEB_PORT:-8080}:8000"
    environment:
      <<: *env
      RUN_MIGRATIONS: "true"
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.barkeep.rule=Host(`barkeep.ir`)"
      - "traefik.http.routers.barkeep.entrypoints=websecure"
      - "traefik.http.routers.barkeep.tls.certresolver=le"
      # Traefik reaches the container directly over traefik_proxy, so this is
      # the port Octane binds inside the container — not the published one.
      - "traefik.http.services.barkeep.loadbalancer.server.port=8000"

  queue:
    <<: *image
    command: php artisan queue:work --tries=3 --timeout=90 --sleep=1
    environment:
      <<: *env
      # The web container owns migrations; this one just waits for the schema.
      RUN_MIGRATIONS: "false"
    depends_on:
      web:
        condition: service_healthy

networks:
  traefik_proxy:
    external: true

volumes:
  storage:
